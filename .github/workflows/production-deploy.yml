name: Production Deploy
run-name: Production Deploy (${{ github.event.inputs.mode || github.ref_name }})

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run dry-run checks or deploy to production.
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - deploy

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  dry-run:
    name: Production deploy dry run
    if: ${{ github.event.inputs.mode == 'dry-run' }}
    environment: production
    runs-on: [self-hosted, Windows, mjuclaw-prod-windows]
    timeout-minutes: 10

    env:
      DEPLOY_WORKDIR: 'C:\Users\yoonh\Desktop\mjuclaw-setup'

    steps:
      - name: Guard main branch only
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ github.ref }}" -ne "refs/heads/main") {
            throw "Production deploy dry run must be dispatched from main. Current ref: ${{ github.ref }}"
          }

      - name: Show runner context
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Machine: $env:COMPUTERNAME"
          Write-Host "Deploy workdir: $env:DEPLOY_WORKDIR"

      - name: Sync production checkout
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path -LiteralPath $env:DEPLOY_WORKDIR -PathType Container)) {
            throw "Production checkout not found: $env:DEPLOY_WORKDIR"
          }

          Set-Location $env:DEPLOY_WORKDIR

          if (-not (Test-Path -LiteralPath ".git" -PathType Container)) {
            throw "Production checkout is not a git repository: $env:DEPLOY_WORKDIR"
          }

          $status = git status --short
          if ($status) {
            $status | ForEach-Object { Write-Host $_ }
            throw "Production checkout has uncommitted changes. Clean the checkout before running deployment automation."
          }

          git fetch origin main
          git switch main
          git pull --ff-only origin main
          git rev-parse --short HEAD

      - name: Validate release candidate
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-Location $env:DEPLOY_WORKDIR
          .\prepare-release.ps1 -CheckOnly

      - name: Free Docker disk before preflight
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-Location $env:DEPLOY_WORKDIR
          .\free-docker-disk.ps1

      - name: Validate deploy preflight
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-Location $env:DEPLOY_WORKDIR
          .\deploy.ps1 -CheckOnly

      - name: Validate backup preflight
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-Location $env:DEPLOY_WORKDIR
          .\backup.ps1 -CheckOnly

  deploy:
    name: Production deploy
    if: ${{ github.event.inputs.mode == 'deploy' }}
    environment: production
    runs-on: [self-hosted, Windows, mjuclaw-prod-windows]
    timeout-minutes: 30

    env:
      DEPLOY_WORKDIR: 'C:\Users\yoonh\Desktop\mjuclaw-setup'

    steps:
      - name: Guard main branch only
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ github.ref }}" -ne "refs/heads/main") {
            throw "Production deploy must be dispatched from main. Current ref: ${{ github.ref }}"
          }

      - name: Show runner context
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Machine: $env:COMPUTERNAME"
          Write-Host "Deploy workdir: $env:DEPLOY_WORKDIR"

      - name: Sync production checkout
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path -LiteralPath $env:DEPLOY_WORKDIR -PathType Container)) {
            throw "Production checkout not found: $env:DEPLOY_WORKDIR"
          }

          Set-Location $env:DEPLOY_WORKDIR

          if (-not (Test-Path -LiteralPath ".git" -PathType Container)) {
            throw "Production checkout is not a git repository: $env:DEPLOY_WORKDIR"
          }

          $status = git status --short
          if ($status) {
            $status | ForEach-Object { Write-Host $_ }
            throw "Production checkout has uncommitted changes. Clean the checkout before running deployment automation."
          }

          git fetch origin main
          git switch main
          git pull --ff-only origin main
          git rev-parse --short HEAD

      - name: Apply release candidate
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-Location $env:DEPLOY_WORKDIR
          .\prepare-release.ps1 -Apply

      - name: Validate deploy preflight
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-Location $env:DEPLOY_WORKDIR
          .\deploy.ps1 -CheckOnly

      - name: Free Docker disk before pull
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-Location $env:DEPLOY_WORKDIR
          .\free-docker-disk.ps1

      - name: Pull production images
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-Location $env:DEPLOY_WORKDIR
          .\deploy.ps1 -PullOnly

      - name: Create production backup
        id: backup
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-Location $env:DEPLOY_WORKDIR
          .\backup.ps1

      - name: Deploy with rollback on failure
        id: deploy
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-Location $env:DEPLOY_WORKDIR
          .\deploy.ps1 -RollbackOnFailure

      - name: Run post-deploy smoke test
        id: smoke
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-Location $env:DEPLOY_WORKDIR
          .\smoke-test.ps1

      - name: Write deployment summary
        if: ${{ always() && steps.deploy.outcome != 'skipped' }}
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-Location $env:DEPLOY_WORKDIR
          .\write-deploy-summary.ps1 `
            -Title "Production Manual Deploy Summary" `
            -Mode "manual" `
            -BackupOutcome "${{ steps.backup.outcome }}" `
            -DeployOutcome "${{ steps.deploy.outcome }}" `
            -SmokeOutcome "${{ steps.smoke.outcome }}"

      - name: Show latest deployment record
        if: ${{ always() && steps.deploy.outcome != 'skipped' }}
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-Location $env:DEPLOY_WORKDIR
          $latest = Get-ChildItem .deploy\releases | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $latest) {
            throw "No deployment record found."
          }
          Get-Content (Join-Path $latest.FullName "deploy.json")

      - name: Show latest smoke test record
        if: ${{ always() && steps.smoke.outcome != 'skipped' }}
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-Location $env:DEPLOY_WORKDIR
          $latest = Get-ChildItem .deploy\smoke-tests | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $latest) {
            throw "No smoke test record found."
          }
          Get-Content (Join-Path $latest.FullName "smoke-test.json")
