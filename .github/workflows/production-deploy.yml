name: Production Deploy
run-name: Production Deploy (${{ github.event.inputs.mode || github.event.workflow_run.head_branch || github.ref_name }})

on:
  workflow_run:
    workflows:
      - Production Dry Run
    types:
      - completed
  workflow_dispatch:
    inputs:
      mode:
        description: Run dry-run checks or deploy to production.
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - deploy

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  auto-deploy-gate:
    name: Prepare automatic deploy gate
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_deploy: ${{ steps.main-head.outputs.should_deploy }}

    steps:
      - name: Confirm source workflow head is current main
        id: main-head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          actual_head="$(
            git -c http.https://github.com/.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" \
              ls-remote "https://github.com/${REPOSITORY}.git" refs/heads/main |
              awk '{print $1}'
          )"

          if [ -z "$actual_head" ]; then
            echo "Could not resolve origin/main."
            exit 1
          fi

          echo "Source workflow head: ${EXPECTED_HEAD}"
          echo "Current origin/main: ${actual_head}"

          if [ "$actual_head" != "$EXPECTED_HEAD" ]; then
            echo "Skipping stale automatic production deploy."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

  dry-run:
    name: Production deploy dry run
    if: ${{ github.event.inputs.mode == 'dry-run' }}
    environment: production
    runs-on: [self-hosted, Windows, mjuclaw-prod-windows]
    timeout-minutes: 10

    env:
      DEPLOY_WORKDIR: 'C:\Users\yoonh\Desktop\mjuclaw-setup'

    steps:
      - name: Guard main branch only
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ github.ref }}" -ne "refs/heads/main") {
            throw "Production deploy dry run must be dispatched from main. Current ref: ${{ github.ref }}"
          }

      - name: Show runner context
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Machine: $env:COMPUTERNAME"
          Write-Host "Deploy workdir: $env:DEPLOY_WORKDIR"

      - name: Sync production checkout
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path -LiteralPath $env:DEPLOY_WORKDIR -PathType Container)) {
            throw "Production checkout not found: $env:DEPLOY_WORKDIR"
          }

          Set-Location $env:DEPLOY_WORKDIR

          if (-not (Test-Path -LiteralPath ".git" -PathType Container)) {
            throw "Production checkout is not a git repository: $env:DEPLOY_WORKDIR"
          }

          $status = git status --short
          if ($status) {
            $status | ForEach-Object { Write-Host $_ }
            throw "Production checkout has uncommitted changes. Clean the checkout before running deployment automation."
          }

          git fetch origin main
          git switch main
          git pull --ff-only origin main
          git rev-parse --short HEAD

      - name: Validate release candidate
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-Location $env:DEPLOY_WORKDIR
          .\prepare-release.ps1 -CheckOnly

      - name: Validate deploy preflight
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-Location $env:DEPLOY_WORKDIR
          .\deploy.ps1 -CheckOnly

      - name: Validate backup preflight
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-Location $env:DEPLOY_WORKDIR
          .\backup.ps1 -CheckOnly

  deploy:
    name: Production deploy
    needs: auto-deploy-gate
    if: ${{ always() && (github.event.inputs.mode == 'deploy' || needs.auto-deploy-gate.outputs.should_deploy == 'true') }}
    environment: production
    runs-on: [self-hosted, Windows, mjuclaw-prod-windows]
    timeout-minutes: 30

    env:
      DEPLOY_WORKDIR: 'C:\Users\yoonh\Desktop\mjuclaw-setup'

    steps:
      - name: Guard main branch only
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ github.event_name }}" -eq "workflow_run") {
            if ("${{ github.event.workflow_run.conclusion }}" -ne "success") {
              throw "Automatic production deploy requires a successful Production Dry Run workflow. Current conclusion: ${{ github.event.workflow_run.conclusion }}"
            }
            if ("${{ github.event.workflow_run.head_branch }}" -ne "main") {
              throw "Automatic production deploy must run from main. Current branch: ${{ github.event.workflow_run.head_branch }}"
            }
            if ("${{ github.event.workflow_run.event }}" -ne "workflow_run") {
              throw "Automatic production deploy must follow an automatic Production Dry Run. Current source event: ${{ github.event.workflow_run.event }}"
            }
          }
          elseif ("${{ github.ref }}" -ne "refs/heads/main") {
            throw "Production deploy must be dispatched from main. Current ref: ${{ github.ref }}"
          }

      - name: Show runner context
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Machine: $env:COMPUTERNAME"
          Write-Host "Deploy workdir: $env:DEPLOY_WORKDIR"
          Write-Host "Event: ${{ github.event_name }}"
          if ("${{ github.event_name }}" -eq "workflow_run") {
            Write-Host "Production Dry Run head branch: ${{ github.event.workflow_run.head_branch }}"
            Write-Host "Production Dry Run head SHA: ${{ github.event.workflow_run.head_sha }}"
            Write-Host "Production Dry Run conclusion: ${{ github.event.workflow_run.conclusion }}"
          }

      - name: Sync production checkout
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path -LiteralPath $env:DEPLOY_WORKDIR -PathType Container)) {
            throw "Production checkout not found: $env:DEPLOY_WORKDIR"
          }

          Set-Location $env:DEPLOY_WORKDIR

          if (-not (Test-Path -LiteralPath ".git" -PathType Container)) {
            throw "Production checkout is not a git repository: $env:DEPLOY_WORKDIR"
          }

          $status = git status --short
          if ($status) {
            $status | ForEach-Object { Write-Host $_ }
            throw "Production checkout has uncommitted changes. Clean the checkout before running deployment automation."
          }

          git fetch origin main

          if ("${{ github.event_name }}" -eq "workflow_run") {
            $expectedHead = "${{ github.event.workflow_run.head_sha }}"
            $originMain = (git rev-parse origin/main).Trim()
            if ($originMain -ne $expectedHead) {
              throw "Automatic production deploy is stale. Production Dry Run completed for $expectedHead, but origin/main is $originMain."
            }
          }

          git switch main
          git pull --ff-only origin main
          git rev-parse --short HEAD

      - name: Apply release candidate
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-Location $env:DEPLOY_WORKDIR
          .\prepare-release.ps1 -Apply

      - name: Validate deploy preflight
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-Location $env:DEPLOY_WORKDIR
          .\deploy.ps1 -CheckOnly

      - name: Pull production images
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-Location $env:DEPLOY_WORKDIR
          .\deploy.ps1 -PullOnly

      - name: Create production backup
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-Location $env:DEPLOY_WORKDIR
          .\backup.ps1

      - name: Deploy with rollback on failure
        id: deploy
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-Location $env:DEPLOY_WORKDIR
          .\deploy.ps1 -RollbackOnFailure

      - name: Run post-deploy smoke test
        id: smoke
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-Location $env:DEPLOY_WORKDIR
          .\smoke-test.ps1

      - name: Show latest deployment record
        if: ${{ always() && steps.deploy.outcome != 'skipped' }}
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-Location $env:DEPLOY_WORKDIR
          $latest = Get-ChildItem .deploy\releases | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $latest) {
            throw "No deployment record found."
          }
          Get-Content (Join-Path $latest.FullName "deploy.json")

      - name: Show latest smoke test record
        if: ${{ always() && steps.smoke.outcome != 'skipped' }}
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-Location $env:DEPLOY_WORKDIR
          $latest = Get-ChildItem .deploy\smoke-tests | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $latest) {
            throw "No smoke test record found."
          }
          Get-Content (Join-Path $latest.FullName "smoke-test.json")
