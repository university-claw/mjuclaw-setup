services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mjuclaw-agent
    restart: unless-stopped
    ports:
      - "18789:18789"
      - "${VIEW_PORT:-3001}:${VIEW_PORT:-3001}"
    # Linux 호스트에서 host.docker.internal을 쓰려면 host-gateway로 매핑.
    # macOS/Windows Docker Desktop은 기본 동작이라 이 설정이 있어도 무해하다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # ── Discord ───────────────────────────────────────────────────
      # 봇 토큰은 mjuclaw-router가 단독으로 들고 있어야 한다. agent에는 토큰을
      # 절대 노출하지 않는다 — enabled=False여도 sidecar/health-monitor 경로에서
      # connect를 시도해 사용자 컨텍스트가 격리되지 않은 채 메시지가 agent로
      # 직접 들어가 LLM이 잘못된 사용자 데이터로 응답하는 사고가 발생한다
      # (2026-05-03 운영 데이터 누출 사고). entrypoint.sh가 set이면 abort한다.
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENCLAW_MODEL=${OPENCLAW_MODEL:-gemini-2.5-flash}
      - DISCORD_SERVER_ID=${DISCORD_SERVER_ID:-1492100109997969499}
      - DISCORD_USER_ID=${DISCORD_USER_ID:-415349075274104832}
      - VIEW_PORT=${VIEW_PORT:-3001}
      - VIEW_BASE_URL=${VIEW_BASE_URL:-http://localhost:3001}
      # ── 라우터 우회 (cron alert helper가 outbound DM 보낼 때) ──────
      # bin/mju-news-alert / bin/mju-attendance-alert 가 사용한다.
      - MJUCLAW_ROUTER_URL=${MJUCLAW_ROUTER_URL:-http://mjuclaw-router:3100}
      - MJUCLAW_ROUTER_TOKEN=${MJUCLAW_ROUTER_TOKEN}
      # ── OpenClaw gateway 인증 토큰 (router가 forward 시 사용) ─────
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      # ── 호스트 Postgres (mju-public-data-worker 공유 DB) ────────────
      - PGHOST=${PGHOST:-host.docker.internal}
      - PGPORT=${PGPORT:-5432}
      - PGDATABASE=${PGDATABASE:-mjuclaw}
      - PGUSER=${PGUSER:-mjuclaw_app}
      - PGPASSWORD=${PGPASSWORD}
      - PGSCHEMA=${PGSCHEMA:-public_data}
      # ── user_data 스키마 접속 (mju-cli 전용 ROLE) ───────────────────
      # worker 의 PG* 와 분리된 ROLE 이어야 한다. 공개/개인 경계 원칙.
      - MJU_STORAGE=${MJU_STORAGE:-postgres}
      - MJU_PGHOST=${MJU_PGHOST:-${PGHOST:-host.docker.internal}}
      - MJU_PGPORT=${MJU_PGPORT:-${PGPORT:-5432}}
      - MJU_PGDATABASE=${MJU_PGDATABASE:-${PGDATABASE:-mjuclaw}}
      - MJU_PGUSER=${MJU_PGUSER:-mjuclaw_user_app}
      - MJU_PGPASSWORD=${MJU_PGPASSWORD}
      - MJU_PGSCHEMA=${MJU_PGSCHEMA:-user_data}
      # envelope encryption 키 (openssl rand -hex 32). 분실 시 복호화 불가.
      - MJU_VAULT_KEY=${MJU_VAULT_KEY}
    volumes:
      - agent-data:/home/agent/.openclaw
      - user-data:/data/users
      - ${STORAGE_LOCAL_ROOT}:/data/assets:ro
    depends_on:
      router:
        condition: service_started

  # ── mjuclaw-router ────────────────────────────────────────────────
  # Discord WS 단독 listener + 결정론적 온보딩 게이트 + cron alert 우회 HTTP.
  # 봇 토큰을 단독으로 들고 OpenClaw 측 discord 채널은 비활성화된다.
  # 빌드 시 mju-cli 소스를 additional_contexts로 주입한다 (setup.sh가 clone).
  router:
    build:
      context: ./mjuclaw-router
      dockerfile: Dockerfile
      additional_contexts:
        mju-cli: ./mju-cli
    container_name: mjuclaw-router
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_SERVER_ID:-1492100109997969499}
      - USER_DATA_ROOT=/data/users
      - OPENCLAW_GATEWAY_URL=${OPENCLAW_GATEWAY_URL:-ws://mjuclaw-agent:18789}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      # docker-compose 내부 네트워크(trusted private)에서만 접근하므로 plaintext ws://
      # 허용. 외부 노출 시 wss:// + 인증서로 전환할 것.
      - OPENCLAW_ALLOW_INSECURE_PRIVATE_WS=1
      - HTTP_PORT=3100
      - HTTP_BIND_HOST=0.0.0.0
      - HTTP_AUTH_TOKEN=${MJUCLAW_ROUTER_TOKEN}
      - LOG_LEVEL=${ROUTER_LOG_LEVEL:-info}
      - NODE_ENV=production
      # ── Intent classifier (MVP-2) ──────────────────────────────
      # CLASSIFIER_ENABLED=false면 classifier 호출 없이 forward만 (MVP-1 동작).
      - CLASSIFIER_ENABLED=${CLASSIFIER_ENABLED:-true}
      - CLASSIFIER_URL=${CLASSIFIER_URL:-http://mjuclaw-classifier:3200}
      - CLASSIFIER_AUTH_TOKEN=${CLASSIFIER_AUTH_TOKEN}
      - CLASSIFIER_TIMEOUT_MS=${CLASSIFIER_TIMEOUT_MS:-2500}
      # mju-cli postgres 백엔드 (vault read/write를 router도 동일 ROLE로 수행)
      - MJU_STORAGE=${MJU_STORAGE:-postgres}
      - MJU_PGHOST=${MJU_PGHOST:-${PGHOST:-host.docker.internal}}
      - MJU_PGPORT=${MJU_PGPORT:-${PGPORT:-5432}}
      - MJU_PGDATABASE=${MJU_PGDATABASE:-${PGDATABASE:-mjuclaw}}
      - MJU_PGUSER=${MJU_PGUSER:-mjuclaw_user_app}
      - MJU_PGPASSWORD=${MJU_PGPASSWORD}
      - MJU_PGSCHEMA=${MJU_PGSCHEMA:-user_data}
      - MJU_VAULT_KEY=${MJU_VAULT_KEY}
    volumes:
      - user-data:/data/users
      # router의 openclaw client state(device pairing key 등) 영속화. 이 볼륨이
      # 없으면 컨테이너 재생성 시 새 device key가 생기고 매번 agent에서 수동
      # 승인이 필요해진다.
      - router-data:/home/router/.openclaw
    # host port 매핑 없음 — compose 내부 네트워크 전용 (3100은 agent → router만)

  # ── mjuclaw-classifier (MVP-2 intent gate) ───────────────────────
  # KcELECTRA-base 15-class 한국어 의도 분류 FastAPI. router가 사용자 메시지를
  # forward하기 전에 호출하여 abuse 차단 + (향후) service 라우팅 분기.
  # 모델 가중치(~500MB)가 이미지에 포함되므로 첫 빌드는 다소 무겁다.
  classifier:
    build:
      context: ./intent-classifier
      dockerfile: serving/Dockerfile
    container_name: mjuclaw-classifier
    restart: unless-stopped
    environment:
      - MODEL_DIR=/opt/intent-classifier/model
      - ABUSE_THRESHOLD=${CLASSIFIER_ABUSE_THRESHOLD:-0.25}
      - CLASSIFIER_AUTH_TOKEN=${CLASSIFIER_AUTH_TOKEN}
      - LOG_LEVEL=${CLASSIFIER_LOG_LEVEL:-INFO}
      - PORT=3200
    # host port 매핑 없음 — router → classifier 내부 네트워크 전용

  # ── mju-public-data-worker (공지/학식 정본 생성) ─────────────────
  # 이전엔 호스트 launchd(`com.mjuclaw.worker.plist`)가 매 15분 schedule:tick을
  # 실행했지만 다른 호스트(Linux server, 다른 Mac)로 옮길 때 launchd 의존이
  # portability 막힘 → compose service로 통합. 컨테이너 entrypoint가 시작 시
  # migrate 1회 + 매 900초 schedule:tick 무한 loop. 호스트 launchd는 운영자가
  # 수동으로 unload 권장 (`launchctl unload ~/Library/LaunchAgents/com.mjuclaw.worker.plist`).
  worker:
    build:
      context: ./mju-public-data-worker
      dockerfile: Dockerfile
    container_name: mjuclaw-worker
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 공개 데이터 스키마(public_data)는 worker가 단독 write — agent와 같은 PG.
      - PGHOST=${PGHOST:-host.docker.internal}
      - PGPORT=${PGPORT:-5432}
      - PGDATABASE=${PGDATABASE:-mjuclaw}
      - PGUSER=${PGUSER:-mjuclaw_app}
      - PGPASSWORD=${PGPASSWORD}
      - PGSCHEMA=${PGSCHEMA:-public_data}
      - LOG_LEVEL=${WORKER_LOG_LEVEL:-info}
      # 자산 디렉토리 — agent는 read-only로 같은 경로 mount.
      - STORAGE_LOCAL_ROOT=/data/assets
    volumes:
      # 호스트 path 사용 (.env의 STORAGE_LOCAL_ROOT) — agent와 공유.
      # 다른 호스트로 옮길 때 호스트 path만 다시 지정하면 됨.
      - ${STORAGE_LOCAL_ROOT}:/data/assets
    # host port 매핑 없음 — schedule worker는 outbound HTTP만 사용

  public-data-db:
    image: postgres:16-alpine
    container_name: mjuclaw-public-data-db
    profiles:
      - public-data
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${PUBLIC_DATA_PGDATABASE:-mjuclaw}
      - POSTGRES_USER=${PUBLIC_DATA_PGUSER:-mjuclaw_app}
      - POSTGRES_PASSWORD=${PUBLIC_DATA_PGPASSWORD:-change-me}
    volumes:
      - public-data-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  public-data-worker:
    build:
      context: ${PUBLIC_DATA_WORKER_CONTEXT:-./mju-public-data-worker}
      dockerfile: Dockerfile
    container_name: mjuclaw-public-data-worker
    profiles:
      - public-data
    restart: unless-stopped
    depends_on:
      public-data-db:
        condition: service_healthy
    environment:
      - PGHOST=public-data-db
      - PGPORT=5432
      - PGDATABASE=${PUBLIC_DATA_PGDATABASE:-mjuclaw}
      - PGUSER=${PUBLIC_DATA_PGUSER:-mjuclaw_app}
      - PGPASSWORD=${PUBLIC_DATA_PGPASSWORD:-change-me}
      - PGSCHEMA=${PUBLIC_DATA_PGSCHEMA:-public_data}
      - STORAGE_PROVIDER=local
      - STORAGE_LOCAL_ROOT=/data/public-assets
      - OCR_LANGUAGES=${PUBLIC_DATA_OCR_LANGUAGES:-kor+eng}
      - CAFETERIA_OCR_COMMAND=${CAFETERIA_OCR_COMMAND:-python scripts/cafeteria_paddleocr_candidate.py {image}}
      - PADDLE_OCR_DET_MODEL_NAME=${PADDLE_OCR_DET_MODEL_NAME:-}
      - PADDLE_OCR_REC_MODEL_NAME=${PADDLE_OCR_REC_MODEL_NAME:-korean_PP-OCRv5_mobile_rec}
      - PUBLIC_DATA_WORKER_TICK_INTERVAL_SECONDS=${PUBLIC_DATA_WORKER_TICK_INTERVAL_SECONDS:-600}
      - PUBLIC_DATA_WORKER_RUN_MIGRATIONS=${PUBLIC_DATA_WORKER_RUN_MIGRATIONS:-1}
    volumes:
      - public-data-assets:/data/public-assets
      - public-data-paddle-models:/root/.paddlex

volumes:
  agent-data:
  user-data:
  router-data:
  public-data-db:
  public-data-assets:
  public-data-paddle-models:
